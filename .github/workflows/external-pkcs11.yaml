name: Tests of external pkcs11 modules

on:
  pull_request:
    paths:
      - '**.c'
      - '**.h'
      - '**.sh'
      - .github/workflows/external-pkcs11.yaml
      - '**.am'
      - doc/**
      - configure.ac
  push:

permissions:
  contents: read  #  to fetch code (actions/checkout)

env:
  BASE_DEPS: |
    build-essential docbook-xsl xsltproc gengetopt help2man pcscd check
    pcsc-tools libtool make autoconf autoconf-archive automake pkg-config
    git xxd openssl valgrind socat gawk
    libglib2.0-dev libnss3-dev gnutls-bin libusb-dev libudev-dev flex
    libnss3-tools
    libpcsclite-dev libcmocka-dev libssl-dev zlib1g-dev libreadline-dev softhsm2

jobs:
  #######################
  ## pkcs11-tool tests ##
  #######################

  test-kryoptic:
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
    env:
      SOURCE_PATH: ./
      BUILD_PATH: ./
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Fedora
        run: .github/setup-fedora.sh kryoptic
      - name: Install OpenSC
        run: .github/build.sh
      - name: Test with Kryoptic
        run: tests/test-kryoptic.sh

  test-freehsm:
    runs-on: ubuntu-24.04
    # FreeHSM needs OpenSSL 3.5, which Ubuntu 24.04 does not have
    container:
      image: debian:trixie
    env:
      SOURCE_PATH: ./
      BUILD_PATH: ./
      FREEHSM_VERSION: v2.6.0
    steps:
      - name: Install dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq git python3 $BASE_DEPS
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Build FreeHSM
        run: |
          git clone --depth 1 --branch "$FREEHSM_VERSION"             https://github.com/afchine1337/freehsm /tmp/freehsm
          make -C /tmp/freehsm PROFILE=all-mechanisms
          install -m 755 /tmp/freehsm/libfreehsm.so /usr/local/lib/
      - name: Build OpenSC
        run: .github/build.sh
      - name: Test FreeHSM
        run: tests/test-freehsm.sh

  test-softokn:
    runs-on: ubuntu-24.04
    env:
      SOURCE_PATH: ./
      BUILD_PATH: ./
    steps:
      - uses: actions/checkout@v7
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ env.BASE_DEPS }}
          version: apt-20-base
          execute_install_scripts: true
      - name: Setup Ubuntu
        run: .github/setup-linux.sh softokn
      - name: Build OpenSC
        run: .github/build.sh
      - name: Test NSS Softokn
        env:
          LD_LIBRARY_PATH: /usr/local/lib
        run: tests/test-softokn.sh

  test-softhsm:
    runs-on: ubuntu-24.04
    env:
      SOURCE_PATH: ./
      BUILD_PATH: ./
    steps:
      - uses: actions/checkout@v7
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ env.BASE_DEPS }}
          version: apt-20-base
          execute_install_scripts: true
      - name: Setup Ubuntu
        run: .github/setup-linux.sh
      - name: Build OpenSC
        run: .github/build.sh
      - name: Test SoftHSM
        env:
          LD_LIBRARY_PATH: /usr/local/lib
        run: tests/test-softhsm.sh

  test-interoperability:
    runs-on: ubuntu-24.04
    container:
      image: fedora:latest
    env:
      SOURCE_PATH: ./
      BUILD_PATH: ./
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Fedora
        run: .github/setup-fedora.sh kryoptic
      - name: Install OpenSC
        run: .github/build.sh
      - name: Interoperability tests
        run: tests/test-pkcs11-tool-unwrap-wrap-interoperability-test.sh
